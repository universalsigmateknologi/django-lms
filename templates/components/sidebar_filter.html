<!-- ===== SIDEBAR FILTER ===== -->
<aside id="sidebar" class="hidden lg:block w-64 shrink-0 border-r border-navy-100 bg-white">
    <form method="GET" action="{% url 'course_preview' %}" id="filter-form" class="sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto sidebar-scroll p-5 space-y-6">
        <!-- Keep search query in the form if it exists -->
        {% if search_query %}
            <input type="hidden" name="search" value="{{ search_query }}">
        {% endif %}
        {% if sort_by %}
            <input type="hidden" name="sort" value="{{ sort_by }}">
        {% endif %}

        <!-- Header -->
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-bold text-navy-900">Filter</h2>
            <a href="{% url 'course_preview' %}"
                class="text-xs font-medium text-navy-500 hover:text-navy-900 transition-colors">Reset</a>
        </div>

        <!-- Kategori -->
        <div>
            <button type="button" onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Kategori
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                {% for category in categories %}
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" name="category" value="{{ category.slug }}" class="custom-check" 
                        onchange="this.form.submit()" {% if category.slug in selected_categories %}checked{% endif %}>
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">{{ category.name }}</span>
                    <span class="ml-auto text-xs text-navy-400">{{ category.course_count }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>

        <!-- Level -->
        <div>
            <button type="button" onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Level
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                {% for level_val, level_label in levels %}
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" name="level" value="{{ level_val }}" class="custom-check" 
                        onchange="this.form.submit()" {% if level_val in selected_levels %}checked{% endif %}>
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">{{ level_label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>

        <!-- Harga -->
        <div>
            <button type="button" onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Harga
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body">
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" value="all" class="custom-radio" 
                        onchange="this.form.submit()" {% if selected_price == 'all' or not selected_price %}checked{% endif %}>
                    <span class="text-sm text-navy-600">Semua Harga</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" value="free" class="custom-radio" 
                        onchange="this.form.submit()" {% if selected_price == 'free' %}checked{% endif %}>
                    <span class="text-sm text-navy-600">Gratis</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" value="under200" class="custom-radio" 
                        onchange="this.form.submit()" {% if selected_price == 'under200' %}checked{% endif %}>
                    <span class="text-sm text-navy-600">Di bawah Rp200K</span>
                </div>
                <div class="flex items-center gap-2 mb-4">
                    <input type="radio" name="price" value="custom" class="custom-radio" id="price-range-radio"
                        onchange="togglePriceInputs(this)" {% if selected_price == 'custom' %}checked{% endif %}>
                    <span class="text-sm text-navy-600">Rentang custom</span>
                </div>
                <div id="price-range-inputs"
                    class="flex items-center gap-2 {% if selected_price != 'custom' %}opacity-40 pointer-events-none{% endif %} transition-opacity">
                    <div class="flex-1">
                        <input type="number" name="min_price" placeholder="Min" value="{{ request.GET.min_price|default:0 }}"
                            class="w-full px-2.5 py-1.5 text-sm border border-navy-200 rounded-md text-navy-900 placeholder:text-navy-300 focus:outline-none focus:ring-1 focus:ring-navy-900 focus:border-transparent">
                    </div>
                    <span class="text-navy-300 text-xs">—</span>
                    <div class="flex-1">
                        <input type="number" name="max_price" placeholder="Max" value="{{ request.GET.max_price|default:500000 }}"
                            class="w-full px-2.5 py-1.5 text-sm border border-navy-200 rounded-md text-navy-900 placeholder:text-navy-300 focus:outline-none focus:ring-1 focus:ring-navy-900 focus:border-transparent">
                    </div>
                    <button type="submit" class="p-1.5 bg-navy-900 text-white rounded-md hover:bg-navy-800 transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>
        
        <!-- Durasi (Optional implementation) -->
        <div>
            <button type="button" onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Durasi
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" name="duration" value="0-5" class="custom-check" onchange="this.form.submit()" {% if '0-5' in selected_durations %}checked{% endif %}>
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">0–5 jam</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" name="duration" value="5-20" class="custom-check" onchange="this.form.submit()" {% if '5-20' in selected_durations %}checked{% endif %}>
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">5–20 jam</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" name="duration" value="20plus" class="custom-check" onchange="this.form.submit()" {% if '20plus' in selected_durations %}checked{% endif %}>
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">20+ jam</span>
                </label>
            </div>
        </div>
    </form>
</aside>

<script>
    function togglePriceInputs(radio) {
        const inputs = document.getElementById('price-range-inputs');
        if (radio.checked) {
            inputs.classList.remove('opacity-40', 'pointer-events-none');
        } else {
            inputs.classList.add('opacity-40', 'pointer-events-none');
        }
    }
</script>
