<!-- ===== SIDEBAR FILTER ===== -->
<aside id="sidebar" class="hidden lg:block w-64 shrink-0 border-r border-navy-100 bg-white">
    <div class="sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto sidebar-scroll p-5 space-y-6">

        <!-- Header -->
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-bold text-navy-900">Filter</h2>
            <button onclick="clearAllFilters()"
                class="text-xs font-medium text-navy-500 hover:text-navy-900 transition-colors">Reset</button>
        </div>

        <!-- Active Filters -->
        <div id="active-filters" class="hidden">
            <div class="flex flex-wrap gap-1.5" id="active-filter-tags"></div>
        </div>

        <!-- Kategori -->
        <div>
            <button onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Kategori
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Web
                        Development</span>
                    <span class="ml-auto text-xs text-navy-400">342</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">UI/UX
                        Design</span>
                    <span class="ml-auto text-xs text-navy-400">218</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Data
                        Science</span>
                    <span class="ml-auto text-xs text-navy-400">156</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Mobile
                        Development</span>
                    <span class="ml-auto text-xs text-navy-400">134</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Cyber
                        Security</span>
                    <span class="ml-auto text-xs text-navy-400">89</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">DevOps</span>
                    <span class="ml-auto text-xs text-navy-400">76</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Machine
                        Learning</span>
                    <span class="ml-auto text-xs text-navy-400">112</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Digital
                        Marketing</span>
                    <span class="ml-auto text-xs text-navy-400">95</span>
                </label>
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>

        <!-- Level -->
        <div>
            <button onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Level
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Pemula</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Menengah</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Lanjutan</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">Semua
                        Level</span>
                </label>
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>

        <!-- Harga -->
        <div>
            <button onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Harga
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body">
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" class="custom-radio" checked onchange="updateFilters()">
                    <span class="text-sm text-navy-600">Semua Harga</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" class="custom-radio" onchange="updateFilters()">
                    <span class="text-sm text-navy-600">Gratis</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <input type="radio" name="price" class="custom-radio" onchange="updateFilters()">
                    <span class="text-sm text-navy-600">Di bawah Rp200K</span>
                </div>
                <div class="flex items-center gap-2 mb-4">
                    <input type="radio" name="price" class="custom-radio" id="price-range-radio"
                        onchange="updateFilters()">
                    <span class="text-sm text-navy-600">Rentang custom</span>
                </div>
                <div id="price-range-inputs"
                    class="flex items-center gap-2 opacity-40 pointer-events-none transition-opacity">
                    <div class="flex-1">
                        <input type="number" placeholder="Min" value="0"
                            class="w-full px-2.5 py-1.5 text-sm border border-navy-200 rounded-md text-navy-900 placeholder:text-navy-300 focus:outline-none focus:ring-1 focus:ring-navy-900 focus:border-transparent">
                    </div>
                    <span class="text-navy-300 text-xs">—</span>
                    <div class="flex-1">
                        <input type="number" placeholder="Max" value="500000"
                            class="w-full px-2.5 py-1.5 text-sm border border-navy-200 rounded-md text-navy-900 placeholder:text-navy-300 focus:outline-none focus:ring-1 focus:ring-navy-900 focus:border-transparent">
                    </div>
                </div>
            </div>
        </div>

        <div class="h-px bg-navy-100"></div>
        
        <!-- Durasi -->
        <div>
            <button onclick="toggleFilter(this)"
                class="flex items-center justify-between w-full text-xs font-semibold text-navy-700 uppercase tracking-wider mb-3">
                Durasi
                <svg class="w-3.5 h-3.5 text-navy-400 transition-transform" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div class="filter-body space-y-2">
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">0–5 jam</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">5–20 jam</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" onchange="updateFilters()">
                    <span class="text-sm text-navy-600 group-hover:text-navy-900 transition-colors">20+ jam</span>
                </label>
            </div>
        </div>
    </div>
</aside>
