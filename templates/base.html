{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelajahi Kursus — CourseHub</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-navy-50/50 font-sans text-navy-900 min-h-screen flex flex-col">

  <!-- ========== NAVBAR (Authenticated) ========== -->
  <nav class="sticky top-0 z-50 bg-white border-b border-navy-100">
    <div class="max-w-[1440px] mx-auto px-6 flex items-center justify-between h-14">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-navy-900 rounded-lg flex items-center justify-center">
          <svg class="w-4.5 h-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight">CourseHub</span>
      </a>

      <!-- Center Nav -->
      <div class="hidden md:flex items-center gap-1">
        <a href="#" class="text-sm font-medium text-navy-900 bg-navy-50 px-3 py-1.5 rounded-md">Jelajahi</a>
        <a href="#" class="text-sm font-medium text-navy-500 hover:text-navy-900 px-3 py-1.5 rounded-md hover:bg-navy-50 transition-colors">Kursus Saya</a>
        <a href="#" class="text-sm font-medium text-navy-500 hover:text-navy-900 px-3 py-1.5 rounded-md hover:bg-navy-50 transition-colors">Wishlist</a>
        <a href="#" class="text-sm font-medium text-navy-500 hover:text-navy-900 px-3 py-1.5 rounded-md hover:bg-navy-50 transition-colors">Forum</a>
      </div>

      <!-- Right -->
      <div class="flex items-center gap-2">
        <!-- Notification -->
        <button class="relative p-2 text-navy-500 hover:text-navy-900 hover:bg-navy-50 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
          </svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>

        <!-- Divider -->
        <div class="hidden sm:block w-px h-6 bg-navy-100 mx-1"></div>

        <!-- User Menu -->
        <button onclick="toggleUserMenu()" class="flex items-center gap-2.5 p-1.5 pr-3 hover:bg-navy-50 rounded-lg transition-colors">
          <img src="https://picsum.photos/seed/user-me/80/80.jpg" alt="User" class="w-7 h-7 rounded-full object-cover">
          <span class="hidden sm:block text-sm font-medium text-navy-700">Arif R.</span>
          <svg class="w-3.5 h-3.5 text-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
        </button>

        <!-- User Dropdown -->
        <div id="user-dropdown" class="hidden absolute top-14 right-6 w-52 bg-white border border-navy-100 rounded-xl shadow-xl shadow-navy-900/8 py-1.5 z-50">
          <div class="px-4 py-2.5 border-b border-navy-100">
            <p class="text-sm font-semibold text-navy-900">Arif Ramadhan</p>
            <p class="text-xs text-navy-400">arif@email.com</p>
          </div>
          <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-sm text-navy-600 hover:bg-navy-50 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            Profil Saya
          </a>
          <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-sm text-navy-600 hover:bg-navy-50 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            Pengaturan
          </a>
          <div class="my-1.5 border-t border-navy-100"></div>
          <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
            Keluar
          </a>
        </div>
      </div>
    </div>
  </nav>
  {% block content %}
    
  {% endblock content %}
</body>
